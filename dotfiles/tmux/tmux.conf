# -- Notes ------------------------------------------------
# leader -> Ctrl + Space
# leader + , -> rename tab
# leader + . -> move tab to position
# leader + w -> view all windows and sessions
# leader + [ -> vi mode, q exit vi mode
# ---------------------------------------------------------
setw -g cursor-style block
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g prefix C-Space
set -g prefix-timeout 1500
set -g xterm-keys on
set -g extended-keys on
set -g default-terminal "tmux-256color"
set -as terminal-features ',foot:RGB,xterm-ghostty:RGB'
# Preserve outer terminal identity for Yazi terminal detection and previews.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g status off
set -g status-right ""
set -g pane-border-style fg=default,bg=default
set -g pane-active-border-style fg=default,bg=default
set -g allow-passthrough on

if -F '#{>:#{session_windows},1}' 'set -q status on' 'set -q status off'
set-hook -g after-new-window 'if -F "#{>:#{session_windows},1}" "set -q status on" "set -q status off"'
set-hook -g window-linked 'if -F "#{>:#{session_windows},1}" "set -q status on" "set -q status off"'
set-hook -g window-unlinked 'if -F "#{>:#{session_windows},1}" "set -q status on" "set -q status off"'

unbind C-b
bind C-Space send-prefix

# Press prefix, then r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Press prefix, then "
# bind '"' split-window -v -c "#{pane_current_path}"
# Press prefix, then %
# bind % split-window -h -c "#{pane_current_path}"
# Press prefix, then c
bind c new-window -c "#{pane_current_path}"

# Press Ctrl + `
bind -n 'C-`' last-window
# Press Ctrl + 1
bind -n C-1 select-window -t:=1
# Press Ctrl + 2
bind -n C-2 select-window -t:=2
# Press Ctrl + 3
bind -n C-3 select-window -t:=3
# Press Ctrl + 4
bind -n C-4 select-window -t:=4
# Press Ctrl + 5
bind -n C-5 select-window -t:=5
# Press Ctrl + 6
bind -n C-6 select-window -t:=6
# Press Ctrl + 7
bind -n C-7 select-window -t:=7
# Press Ctrl + 8
bind -n C-8 select-window -t:=8
# Press Ctrl + 9
bind -n C-9 select-window -t:=9

# Press Ctrl + Shift + T
bind -n C-S-T new-window -c "#{pane_current_path}"
# Press Ctrl + Shift + W
bind -n C-S-W kill-window
# Press Alt + q
bind -n M-q kill-pane

# Press Alt + =
bind -n M-= split-window -h -c "#{pane_current_path}"
# Press Alt + -
bind -n M-- split-window -v -c "#{pane_current_path}"

# Press Ctrl + Alt + s
bind -n C-M-s display-panes 'swap-pane -s %%'

# Press Ctrl + Shift + <
bind -n C-S-< swap-pane -U
# Press Ctrl + Shift + >
bind -n C-S-> swap-pane -D

# Press Ctrl + Alt + h
bind -n C-M-h select-pane -L
# Press Ctrl + Alt + j
bind -n C-M-j select-pane -D
# Press Ctrl + Alt + k
bind -n C-M-k select-pane -U
# Press Ctrl + Alt + l
bind -n C-M-l select-pane -R

# Press Ctrl + Alt + Up
bind -n C-M-Up resize-pane -U 5
# Press Ctrl + Alt + Down
bind -n C-M-Down resize-pane -D 5
# Press Ctrl + Alt + Left
bind -n C-M-Left resize-pane -L 5
# Press Ctrl + Alt + Right
bind -n C-M-Right resize-pane -R 5

# Press prefix, then t
# "toggle pannel"
bind t resize-pane -Z
# Press prefix, then s
bind s display-popup -E -w 80% -h 70% 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh "#{pane_current_path}"'
# Press prefix, then Tab
bind Tab switch-client -l

# Press prefix, then 1
bind 1 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 1'
# Press prefix, then 2
bind 2 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 2'
# Press prefix, then 3
bind 3 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 3'
# Press prefix, then 4
bind 4 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 4'
# Press prefix, then 5
bind 5 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 5'
# Press prefix, then 6
bind 6 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 6'
# Press prefix, then 7
bind 7 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 7'
# Press prefix, then 8
bind 8 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 8'
# Press prefix, then 9
bind 9 run-shell 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh --switch-index 9'

setw -g mode-keys vi
setw -g copy-mode-selection-style bg=yellow,fg=default
# In copy mode, press v
bind -T copy-mode-vi v send -X begin-selection
# In copy mode, press y
bind -T copy-mode-vi y send -X copy-selection-and-cancel
