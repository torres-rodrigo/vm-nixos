# -- Notes ------------------------------------------------
# leader -> Ctrl + Space
# leader + , -> rename tab
# leader + . -> move tab to position
# ---------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g prefix C-Space
set -g prefix-timeout 1500
set -g xterm-keys on
set -g extended-keys on
set -g default-terminal "tmux-256color"
set -as terminal-features ',foot:RGB'
set -g status off
set -g status-right ""
set -g pane-border-style fg=default,bg=default
set -g pane-active-border-style fg=default,bg=default
set -g allow-passthrough on

if -F '#{>:#{session_windows},1}' 'set -q status on' 'set -q status off'
set-hook -g after-new-window 'if -F "#{>:#{session_windows},1}" "set -q status on" "set -q status off"'
set-hook -g window-linked 'if -F "#{>:#{session_windows},1}" "set -q status on" "set -q status off"'
set-hook -g window-unlinked 'if -F "#{>:#{session_windows},1}" "set -q status on" "set -q status off"'

unbind C-b
bind C-Space send-prefix

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n 'C-`' last-window
bind -n C-1 select-window -t:=1
bind -n C-2 select-window -t:=2
bind -n C-3 select-window -t:=3
bind -n C-4 select-window -t:=4
bind -n C-5 select-window -t:=5
bind -n C-6 select-window -t:=6
bind -n C-7 select-window -t:=7
bind -n C-8 select-window -t:=8
bind -n C-9 select-window -t:=9

bind -n C-S-T new-window -c "#{pane_current_path}"
bind -n C-S-W kill-window
bind -n M-q kill-pane

bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

bind -n C-M-S display-panes 'swap-pane -s %%'

bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

bind -n C-M-Up resize-pane -U 5
bind -n C-M-Down resize-pane -D 5
bind -n C-M-Left resize-pane -L 5
bind -n C-M-Right resize-pane -R 5

bind t resize-pane -Z
bind s display-popup -E -w 80% -h 70% 'sh /etc/nixos/dotfiles/tmux/session-switcher.sh "#{pane_current_path}"'

bind 2 switch-client -t 2
bind 3 switch-client -t 3
bind 4 switch-client -t 4
bind 5 switch-client -t 5
bind 6 switch-client -t 6
bind 7 switch-client -t 7
bind 8 switch-client -t 8
bind 9 switch-client -t 9

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
