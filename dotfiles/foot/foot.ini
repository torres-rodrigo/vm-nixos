[main]
# Tuned for the 3840x2400 eDP-1 panel at Mango scale 1.6.
# The resulting 2400x1500 logical screen targets a 160x50 grid.
font=CaskaydiaCove NF SemiBold:pixelsize=24
line-height=30px
letter-spacing=1px
pad=0x0
resize-by-cells=no
resize-keep-grid=no
initial-window-mode=windowed
shell=/home/r/.config/tmux/foot-tmux.sh

[colors-dark]
alpha=0.85
